<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>講義・課題マネージャー</title>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --border-color: #d1d5db;
      --border-dark: #374151;
      --text-main: #111827;
      --text-sub: #4b5563;
      --sun-color: #dc2626;
      --sat-color: #2563eb;
      --deadline-color: #e11d48;
      --today-bg: #e0f2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important; /* すべての角丸を完全に無効化 */
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ヘッダー & タブ */
    header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--border-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      background: #e5e7eb;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      border-bottom: 2px solid var(--text-main);
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
    }

    .month-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
    }

    .btn-square {
      background: #ffffff;
      border: 1px solid var(--border-dark);
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
    }

    .btn-square:active {
      background: #e5e7eb;
    }

    /* マトリクステーブル表示域 */
    .table-container {
      flex: 1;
      overflow: auto;
      background: var(--card-bg);
      -webkit-overflow-scrolling: touch;
    }

    table {
      border-collapse: collapse;
      width: max-content;
      table-layout: fixed;
    }

    th, td {
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      padding: 4px;
      min-width: 44px;
      height: 52px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #f3f4f6;
      border-bottom: 2px solid var(--border-dark);
      z-index: 10;
    }

    /* 左側科目列の固定 */
    .col-subject {
      position: sticky;
      left: 0;
      background: #ffffff;
      z-index: 20;
      min-width: 110px;
      max-width: 110px;
      text-align: left;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
      border-right: 2px solid var(--border-dark);
    }

    thead th.col-subject {
      z-index: 30;
      background: #f3f4f6;
    }

    .sub-periods {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-sub);
      display: block;
      margin-top: 1px;
    }

    .due-info {
      font-size: 9px;
      font-weight: 600;
      color: var(--deadline-color);
      display: block;
      margin-top: 2px;
    }

    /* 日付表示 */
    .day-num {
      font-size: 13px;
      font-weight: 700;
      display: block;
    }

    .day-name {
      font-size: 10px;
      display: block;
    }

    .day-sun { color: var(--sun-color); }
    .day-sat { color: var(--sat-color); }

    /* セル */
    .cell-slot {
      cursor: pointer;
      font-size: 17px;
      user-select: none;
      background-color: #ffffff;
    }

    .cell-slot:active {
      background-color: #e5e7eb;
    }

    .cell-today {
      background-color: var(--today-bg) !important;
    }

    /* 締め切り境界線（翌日との境界を赤色に） */
    td.deadline-border {
      border-right: 2px solid var(--deadline-color) !important;
    }

    /* ステータス選択メニュー（ボトムシート） */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
    }

    .modal-overlay.active {
      display: flex;
    }

    .bottom-sheet {
      background: #ffffff;
      width: 100%;
      border-top: 3px solid var(--border-dark);
      padding: 16px 14px 28px;
    }

    .sheet-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .status-options {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    .status-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: #f9fafb;
      border: 1px solid var(--border-dark);
      padding: 10px 2px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
